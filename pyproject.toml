[project]
name = "mlops"
version = "0.1.0"
description = "MLOps course: ML model serving with FastAPI and Docker"
readme = "README.md"
authors = [
    { name = "Maciej Merchut", email = "maciek.merchut@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
]

[tool.uv]
package = false
